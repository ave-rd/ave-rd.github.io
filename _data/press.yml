# Project milestones — used by the timeline component on /press/
# and the homepage.
timeline:
  - date: "2014"
    title: "USAID DIV award"
    body: "USAID's Development Innovation Ventures awards J-PAL LAC US$1,258,979 for a three-year policy pilot, later extended to June 2017. MINERD's Department of Orientation and Psychology is the implementing partner."
    state: "past"
  - date: "May 2015"
    title: "First wave: 599 schools randomized"
    body: "Grades 7–8 in 398 schools see the videos (200 informative, 198 persuasive); 201 schools serve as controls."
    state: "past"
  - date: "April 2016"
    title: "Second wave: 2,469 schools, grades 7–12"
    body: "787 informative, 807 persuasive and 875 control schools. The 398 schools treated in 2015 are treated again; students who saw the informative video in both years later show the largest test-score effect (0.129 SD)."
    state: "past"
  - date: "2017"
    title: "Endline report submitted to USAID DIV (Milestone 13)"
    body: "Dropout falls 2.5–3 pp a year after exposure; eighth-grade test scores rise 0.05–0.13 SD. From 2017, MINERD finances and runs the program itself."
    state: "past"
  - date: "Now"
    title: "Planning the long-run follow-up"
    body: "Seeking funding to link students from the original evaluation to administrative earnings records. Timeline to be confirmed."
    state: "current"
