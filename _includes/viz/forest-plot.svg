<svg viewBox="0 0 720 345" class="forest-plot forest-plot--wide" role="img" aria-labelledby="fp-title fp-desc" preserveAspectRatio="xMidYMid meet">
  <title id="fp-title">AVE-RD effects on Pruebas Nacionales scores, by video and exposure</title>
  <desc id="fp-desc">Point estimates with 95% confidence intervals from Table 6 of the 2017 endline report (N = 120,092). Informative video: seen once in 2015, 0.053 SD, not significant; seen once in 2016, 0.065 SD, p &lt; 0.01; seen in both years, 0.129 SD, p &lt; 0.01. Persuasive video: seen once in 2015, −0.020 SD, not significant; seen once in 2016, 0.052 SD, p &lt; 0.05; seen in both years, 0.077 SD, p &lt; 0.05.</desc>

  <!-- Scale: x = 370 + 1000 × effect (SD); 50 px per 0.05 SD.
       CIs are coefficient ± 1.96 × SE from endline Table 6, column 1.
       forest-plot-narrow.svg draws the same estimates for phones;
       change both together. -->
  <g class="forest-grid">
    <line x1="270" y1="24" x2="270" y2="280" />
    <line x1="320" y1="24" x2="320" y2="280" />
    <line x1="420" y1="24" x2="420" y2="280" />
    <line x1="470" y1="24" x2="470" y2="280" />
    <line x1="520" y1="24" x2="520" y2="280" />
    <line x1="570" y1="24" x2="570" y2="280" />
    <line x1="620" y1="24" x2="620" y2="280" />
  </g>

  <line class="forest-zero" x1="370" y1="24" x2="370" y2="280" />
  <line class="forest-axis" x1="270" y1="280" x2="620" y2="280" />

  <text class="forest-tick" x="270" y="298" text-anchor="middle">−0.10</text>
  <text class="forest-tick" x="320" y="298" text-anchor="middle">−0.05</text>
  <text class="forest-tick" x="370" y="298" text-anchor="middle">0</text>
  <text class="forest-tick" x="420" y="298" text-anchor="middle">0.05</text>
  <text class="forest-tick" x="470" y="298" text-anchor="middle">0.10</text>
  <text class="forest-tick" x="520" y="298" text-anchor="middle">0.15</text>
  <text class="forest-tick" x="570" y="298" text-anchor="middle">0.20</text>
  <text class="forest-tick" x="620" y="298" text-anchor="middle">0.25</text>
  <text class="forest-tick" x="445" y="326" text-anchor="middle">Effect on overall score (standard deviations)</text>

  <!-- Informative video -->
  <text class="forest-group" x="20" y="40">Informative video</text>

  <!-- 2015 only: 0.0531 (SE 0.0392), not significant -->
  <text class="forest-label" x="250" y="68" text-anchor="end">Once (2015)</text>
  <line class="forest-ci forest-ci--ns" x1="346.3" y1="64" x2="499.9" y2="64" />
  <circle class="forest-point forest-point--ns" cx="423.1" cy="64" r="6" />
  <text class="forest-value" x="636" y="68">0.053 (n.s.)</text>

  <!-- 2016 only: 0.0646*** (SE 0.0221) -->
  <text class="forest-label" x="250" y="98" text-anchor="end">Once (2016)</text>
  <line class="forest-ci" x1="391.3" y1="94" x2="477.9" y2="94" />
  <circle class="forest-point" cx="434.6" cy="94" r="6" />
  <text class="forest-value" x="636" y="98">0.065***</text>

  <!-- 2015 and 2016: 0.129*** (SE 0.0403) -->
  <text class="forest-label" x="250" y="128" text-anchor="end">Twice (2015 + 2016)</text>
  <line class="forest-ci" x1="420.0" y1="124" x2="578.0" y2="124" />
  <circle class="forest-point forest-point--ed" cx="499.0" cy="124" r="7" />
  <text class="forest-value" x="636" y="128">0.129***</text>

  <!-- Persuasive video -->
  <text class="forest-group" x="20" y="170">Persuasive video</text>

  <!-- 2015 only: −0.0197 (SE 0.0358), not significant -->
  <text class="forest-label" x="250" y="198" text-anchor="end">Once (2015)</text>
  <line class="forest-ci forest-ci--ns" x1="280.1" y1="194" x2="420.5" y2="194" />
  <circle class="forest-point forest-point--ns" cx="350.3" cy="194" r="6" />
  <text class="forest-value" x="636" y="198">−0.020 (n.s.)</text>

  <!-- 2016 only: 0.0521** (SE 0.0228) -->
  <text class="forest-label" x="250" y="228" text-anchor="end">Once (2016)</text>
  <line class="forest-ci" x1="377.4" y1="224" x2="466.8" y2="224" />
  <circle class="forest-point" cx="422.1" cy="224" r="6" />
  <text class="forest-value" x="636" y="228">0.052**</text>

  <!-- 2015 and 2016: 0.0767** (SE 0.0374) -->
  <text class="forest-label" x="250" y="258" text-anchor="end">Twice (2015 + 2016)</text>
  <line class="forest-ci" x1="373.4" y1="254" x2="520.0" y2="254" />
  <circle class="forest-point" cx="446.7" cy="254" r="6" />
  <text class="forest-value" x="636" y="258">0.077**</text>
</svg>
